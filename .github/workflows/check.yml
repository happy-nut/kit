name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/check.py
      - run: npm install --no-save fast-check@4.5.3
      - run: node --disable-warning=ExperimentalWarning --test skills/*/scripts/test/*.test.ts
