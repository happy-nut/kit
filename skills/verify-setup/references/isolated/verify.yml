name: verify
on:
  pull_request:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: walk the feature map as a user
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VERIFY_SKILL: .claude/skills/VERIFY_SKILL_NAME
          VERIFY_PREPARE: "true"
        run: sh .verify/run.sh ${{ github.event_name == 'pull_request' && 'diff' || 'all' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-evidence
          path: .verify-out
      - name: comment the verdicts
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: test -s .verify-out/report.md && gh pr comment ${{ github.event.number }} --body-file .verify-out/report.md
